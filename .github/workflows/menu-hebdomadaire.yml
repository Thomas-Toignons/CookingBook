name: Menu hebdomadaire et courses

on:
  push:
    branches: [main]
    paths:
      - cookBook
      - cookingBook.odb
      - regles.toml
      - 'scripts/**'
      - 'templates/**'
      - 'sql/**'
      - '.github/workflows/menu-hebdomadaire.yml'
  schedule:
    - cron: '15 7 * * 1'
      timezone: Europe/Paris
  workflow_dispatch:
    inputs:
      mode:
        description: Générer le menu ou actualiser les courses et la page
        type: choice
        options: [generer, publier]
        default: generer
      nouveau_tirage:
        description: Remplacer explicitement le menu de cette semaine
        type: boolean
        default: false

# Une seconde exécution attend la première ; aucun push forcé sur les données.
concurrency:
  group: cookingbook-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  construire:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Lire le dernier main, même lorsqu'un ancien push attend dans la file.
      - name: Récupérer le code et la base de main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Vérifier le traitement sur des bases temporaires
        run: python -m unittest discover -s tests -v
      - name: Générer le menu et les fichiers du site
        env:
          MODE: ${{ github.event_name == 'push' && 'automatique' || inputs.mode || 'generer' }}
          NOUVEAU_TIRAGE: ${{ inputs.nouveau_tirage }}
        shell: bash
        run: |
          options=()
          if [[ "$NOUVEAU_TIRAGE" == "true" ]]; then
            options+=(--nouveau-tirage)
          fi
          python scripts/principal.py "$MODE" "${options[@]}"
      - name: Enregistrer et pousser les données
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cookBook menus/historique.json docs/index.html docs/courses.csv
          if ! git diff --cached --quiet; then
            git commit -m "Actualiser le menu et la liste de courses"
          fi
          # GITHUB_TOKEN ne redéclenche pas les workflows sur ce push.
          # Un main modifié en parallèle fait échouer ce push, sans écrasement.
          git push origin HEAD:main
      - name: Préparer les fichiers GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
  deployer:
    needs: construire
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Déployer GitHub Pages
        id: deploiement
        uses: actions/deploy-pages@v4
